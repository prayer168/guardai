<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>GuardAI 競賽展示｜單檔離線備援</title>
  <style>
    :root{--navy:#10263d;--deep:#071829;--ivory:#fbf7ef;--gold:#c4a15f;--coral:#9e312f;--sage:#3f6848;--muted:#58656c}*{box-sizing:border-box}html{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--ivory);color:#1f2c34}body{margin:0}button,a{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.wrap{width:min(100% - 2rem,72rem);margin:auto}.hero{background:var(--deep);color:#fff;padding:2rem 0}.hero h1{margin:.8rem 0 0;font-size:clamp(2rem,6vw,3.5rem)}.hero p{max-width:48rem;line-height:1.7;color:#e9dfcc}.badge{display:inline-flex;border:1px solid #c4a15f80;border-radius:999px;padding:.55rem .8rem;color:#efd79f;font-weight:900}.toolbar{display:flex;flex-wrap:wrap;gap:.65rem;margin-top:1.25rem}.button{min-height:3rem;border:1px solid var(--navy);border-radius:999px;padding:.7rem 1.15rem;background:var(--navy);color:#fff;font-weight:900;cursor:pointer}.button.alt{background:#fff;color:var(--navy)}.button:disabled{opacity:.45;cursor:not-allowed}.progress{overflow:auto;margin:1.5rem 0}.progress ol{display:flex;gap:.5rem;min-width:max-content;padding:0;list-style:none}.stepBtn{min-height:3rem;border:0;border-radius:.8rem;padding:.65rem .9rem;background:#eee2ca;color:var(--navy);font-weight:900;cursor:pointer}.stepBtn[aria-current=step]{background:var(--navy);color:#fff}.panel{min-height:34rem;border:1px solid #10263d22;border-radius:1.5rem;background:#fff;padding:clamp(1.25rem,4vw,2.2rem);box-shadow:0 18px 50px #07182912}.panel h2{font-size:clamp(1.6rem,4vw,2.4rem);color:var(--navy)}.panel p,.panel li{line-height:1.75}.grid{display:grid;gap:1rem}.card{border:1px solid #10263d22;border-radius:1rem;padding:1.1rem;background:#fff}.message{border-radius:1rem;background:#f7f0e2;padding:1.25rem;font-size:1.08rem;font-weight:800;line-height:1.8}.signal{border-left:4px solid #d96058;background:#fff7f5}.signal strong{display:block;color:var(--coral)}.number{display:inline-grid;width:2rem;height:2rem;place-items:center;border-radius:50%;background:var(--navy);color:#efd79f;margin-right:.6rem}.notice{border-radius:1rem;background:#fff3d7;padding:1rem;color:#6d480b;font-weight:800}.controls{display:flex;justify-content:space-between;gap:.8rem;margin-top:1.4rem}.persona{margin:1.5rem 0 3rem}.tabs{display:flex;flex-wrap:wrap;gap:.5rem}.tab{min-height:2.8rem;border:1px solid #10263d44;border-radius:999px;background:#fff;padding:.5rem .9rem;font-weight:900;color:var(--navy)}.tab[aria-selected=true]{background:var(--navy);color:#fff}.eyebrow{font-size:.78rem;font-weight:900;letter-spacing:.16em;color:#755521}.mode{color:var(--sage);font-weight:900}.danger{color:var(--coral)}footer{background:var(--navy);color:#eee2ca;padding:1.5rem;text-align:center}@media(min-width:720px){.grid.two{grid-template-columns:repeat(2,1fr)}.grid.three{grid-template-columns:repeat(3,1fr)}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap"><span class="badge">GuardAI 單檔離線備援</span><h1>不替你判斷，陪你完成查證。</h1><p>這個檔案不需要網路、API 或伺服器。所有內容都是安全合成案例，並明確標示為 Demo，不代表即時生成式 AI。</p><div class="toolbar"><button class="button alt" id="reset">重新開始展示</button><a class="button" href="tel:165">撥打 165</a></div></div></header>
  <main class="wrap">
    <nav class="progress" aria-label="展示步驟"><ol id="progress"></ol></nav>
    <section class="panel" id="panel" tabindex="-1" aria-live="polite"></section>
    <div class="controls"><button class="button alt" id="prev">上一步</button><button class="button" id="next">下一步</button></div>
    <section class="panel persona" aria-labelledby="personaTitle"><p class="eyebrow">三種落地情境</p><h2 id="personaTitle">角色、問題、行動與學習證據</h2><div class="tabs" id="tabs" role="tablist"></div><div id="personaPanel" tabindex="0"></div></section>
  </main>
  <footer>此為安全 Demo 引擎｜不呼叫 API｜不保存輸入｜不自動開啟陌生網址</footer>
  <script>
    const message='【商城客服】您的訂單誤設為 12 期扣款，今天內未解除將連續扣款。請立即加入客服 LINE，並提供銀行帳號與簡訊驗證碼，我們會協助退款。';
    const questions=['我能否不使用這則訊息的聯絡方式，直接從商城官方 App 查到訂單？','銀行或商城客服是否真的會要求我提供簡訊驗證碼？','對方能否提供可由官方管道核對的案件編號？'];
    const actions=['立即停止回覆，不加入對方提供的 LINE，也不提供帳號或驗證碼。','保留訊息截圖與時間，但不要點擊或轉傳陌生入口。','自行開啟原本使用的商城 App，從訂單與官方客服頁面確認。','如已提供金融資料，立即聯絡銀行並請可信任成人陪同撥打 165。'];
    const signals=[['商城客服','冒用權威','自稱客服不代表身分已確認。'],['今天內未解除將連續扣款','催促與限時','限時威脅會壓縮思考時間。'],['提供銀行帳號與簡訊驗證碼','個資要求','金融與驗證資料不應交給訊息對方。'],['協助退款','金錢要求','退款操作應由獨立官方管道確認。']];
    const steps=[['問題','一般工具只給高風險；GuardAI 留下原文證據、三問、安全行動與求助。'],['訊息',`<p class="mode">目前模式：安全 Demo 引擎</p><blockquote class="message">${message}</blockquote><p>此案例已內嵌，不會呼叫外部 AI，也不會開啟任何網址。</p>`],['看',`<div class="grid two">${signals.map(s=>`<article class="card signal"><strong>${s[1]}</strong><h3>「${s[0]}」</h3><p>${s[2]}</p></article>`).join('')}</div>`],['問',`<ol>${questions.map((q,i)=>`<li class="card"><span class="number">${i+1}</span>${q}</li>`).join('')}</ol>`],['查',`<ol>${actions.map((a,i)=>`<li class="card"><span class="number">${i+1}</span>${a}</li>`).join('')}</ol>`],['求','<blockquote class="message">我收到一則自稱商城客服的訊息，對方用限時扣款催促我提供銀行帳號與簡訊驗證碼。我尚未操作，想請你陪我從官方管道查證；如有需要，我們可以撥打 165。</blockquote><button class="button" id="copy">複製求助摘要</button><p id="copyStatus" class="mode"></p>'],['成效','<div class="grid two"><article class="card"><p class="eyebrow">Demo 模擬資料</p><h3>匿名班級介面示意</h3><p>28 人、58 → 84 分都只是介面資料，不可當成真實成效。</p></article><article class="card"><p class="eyebrow">真實試用證據</p><h3>尚未有可公開資料</h3><p>未來才填樣本數、日期、情境、前後測與研究限制。</p></article></div>'],['技術','<div class="grid three"><article class="card">1 輸入：只當待分析資料</article><article class="card">2 遮罩：敏感格式</article><article class="card">3 限流：用量保護</article><article class="card">4 分析：OpenAI 或 Demo</article><article class="card">5 驗證：Schema＋Zod</article><article class="card">6 回饋：停看問查求</article></div><div class="grid two"><article class="card"><h3 class="mode">程式／規則測試：40／40</h3><p>2026-10-05 已執行；不是模型準確率。</p></article><article class="card"><h3 class="danger">即時 AI 評測：待完成</h3><p>API Billing／額度未可用，不宣稱通過率。</p></article></div>']];
    const personas=[{id:'student',tab:'學生',role:'國高中學生',problem:'帳號停權私訊要求陌生連結與 OTP。',decision:'關閉私訊，直接開官方 App 查證。',evidence:'能指出限時、連結與 OTP 三項線索。'},{id:'family',tab:'親子／長者',role:'家長陪同長者',problem:'親友新號碼借錢並要求保密。',decision:'停止匯款，回撥原本保存的電話。',evidence:'能辨認冒名、金錢、催促與保密。'},{id:'teacher',tab:'教師',role:'資訊素養教師',problem:'全班練習但不蒐集姓名與原始訊息。',decision:'建立匿名班級，只看群體趨勢。',evidence:'Demo 與真實試用資料分開呈現。'}];
    let index=0,persona='student';const panel=document.querySelector('#panel'),progress=document.querySelector('#progress'),prev=document.querySelector('#prev'),next=document.querySelector('#next');
    function render(){progress.innerHTML=steps.map((s,i)=>`<li><button class="stepBtn" data-step="${i}" ${i===index?'aria-current="step"':''}>${i+1} ${s[0]}</button></li>`).join('');panel.innerHTML=`<p class="eyebrow">第 ${index+1}／${steps.length} 步</p><h2>${steps[index][0]}</h2>${index===0?`<p>${steps[index][1]}</p><button class="button" id="load">一鍵載入示範案例</button>`:steps[index][1]}`;prev.disabled=index===0;next.textContent=index===steps.length-1?'展示完成，重新開始':`下一步：${steps[index+1][0]}`;document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(+b.dataset.step));document.querySelector('#load')?.addEventListener('click',()=>go(1));document.querySelector('#copy')?.addEventListener('click',copyHelp)}
    function go(i){index=Math.max(0,Math.min(steps.length-1,i));render();panel.focus()}
    function copyHelp(){const text=panel.querySelector('blockquote').textContent;const status=document.querySelector('#copyStatus');if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>status.textContent='已複製').catch(()=>fallback(text,status))}else fallback(text,status)}
    function fallback(text,status){const area=document.createElement('textarea');area.value=text;document.body.append(area);area.select();try{document.execCommand('copy');status.textContent='已複製'}catch{status.textContent='請直接選取上方文字'}area.remove()}
    function renderPersonas(){document.querySelector('#tabs').innerHTML=personas.map(p=>`<button class="tab" role="tab" data-persona="${p.id}" aria-selected="${p.id===persona}">${p.tab}</button>`).join('');const p=personas.find(p=>p.id===persona);document.querySelector('#personaPanel').innerHTML=`<h3>${p.role}</h3><p><strong>問題：</strong>${p.problem}</p><p><strong>安全決策：</strong>${p.decision}</p><p><strong>學習證據：</strong>${p.evidence}</p>`;document.querySelectorAll('[data-persona]').forEach(b=>b.onclick=()=>{persona=b.dataset.persona;renderPersonas()})}
    prev.onclick=()=>go(index-1);next.onclick=()=>index===steps.length-1?go(0):go(index+1);document.querySelector('#reset').onclick=()=>go(0);render();renderPersonas();
  </script>
</body>
</html>
